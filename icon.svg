<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
        <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF7F00" />
            <stop offset="100%" stop-color="#cc5200" />
        </linearGradient>
        <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFF0A8" />
            <stop offset="50%" stop-color="#D4AF37" />
            <stop offset="100%" stop-color="#9c8022" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="15" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#4d1f00" flood-opacity="0.5"/>
        </filter>
    </defs>
    
    <!-- Background -->
    <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
    
    <!-- Decorative Inner Border -->
    <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="url(#gold-grad)" stroke-width="6" opacity="0.6" />
    <rect x="36" y="36" width="440" height="440" rx="80" fill="none" stroke="url(#gold-grad)" stroke-width="2" opacity="0.3" />
    
    <!-- Radiant Halo / Prakash -->
    <circle cx="256" cy="230" r="150" fill="url(#gold-grad)" opacity="0.15" filter="url(#glow)"/>
    <circle cx="256" cy="230" r="110" fill="url(#gold-grad)" opacity="0.25" filter="url(#glow)"/>
    <circle cx="256" cy="230" r="70" fill="#ffffff" opacity="0.1" filter="url(#glow)"/>
    
    <!-- Premium Book Icon (Gutka Sahib) -->
    <g transform="translate(116, 90) scale(11.5)" filter="url(#shadow)">
        <path d="M12 21c-1.5-1.3-4-2.5-8-2.5v-13c4 0 6.5 1.2 8 2.5 1.5-1.3 4-2.5 8-2.5v13c-4 0-6.5 1.2-8 2.5z" 
              fill="url(#gold-grad)" stroke="#FFFFFF" stroke-width="0.75" stroke-linejoin="round" />
        <!-- Pages Detail -->
        <path d="M12 21v-14" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M7 8h-2 M8 11h-3 M7 14h-2" stroke="#ffffff" stroke-width="0.5" stroke-linecap="round" opacity="0.5"/>
        <path d="M17 8h2 M16 11h3 M17 14h2" stroke="#ffffff" stroke-width="0.5" stroke-linecap="round" opacity="0.5"/>
    </g>

    <!-- App Name -->
    <text x="256" y="440" font-family="'Cinzel', 'Times New Roman', serif" font-weight="800" font-size="46" fill="#FFFFFF" text-anchor="middle" letter-spacing="6" filter="url(#shadow)">GURBANI</text>
</svg>
